name: Deploy to homelab
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    steps:
      # No actions/checkout: the deployment lives in /srv/docker/campground-checker
      # alongside its .env (which holds the Telegram and R2 credentials), and the
      # runner just drives it. `docker compose up -d` by hand behaves identically.
      - name: Deploy
        run: |
          cd /srv/docker/campground-checker
          git fetch --prune origin
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
