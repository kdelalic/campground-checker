services:
  campsite-checker:
    build: .
    restart: unless-stopped
    volumes:
      # Config is git-managed and the source of truth, so the container gets it
      # read-only. Change monitored campgrounds by editing this file and pushing.
      - ./campsites.yaml:/app/campsites.yaml:ro
      # Telegram dedup keys, persisted so a redeploy doesn't re-alert on
      # availability you have already been told about. The container runs as
      # uid 10001, so this directory must be writable by it on the host
      # (one-time: chown -R 10001:10001 state).
      - ./state:/app/state
    healthcheck:
      # server.py returns 503 once alert scans go stale; surface that as an
      # unhealthy container so monitoring (or autoheal) can act on it.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - SENT_KEYS_PATH=/app/state/sent_keys.json
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET_NAME
      - R2_CUSTOM_DOMAIN
      - THROTTLE_BASE_DELAY=${THROTTLE_BASE_DELAY:-30}
      - THROTTLE_MAX_DELAY=${THROTTLE_MAX_DELAY:-900}
      # Dashboard scan tuning: camply issues one request per campground per
      # month sequentially within a batch, so smaller batches + more workers
      # cut wall-clock (~3.5 min -> ~1.5 min for the current config). If the
      # throttle cooldown metrics start firing, dial these back toward the
      # image defaults (WORKERS=4, BATCH_SIZE=4).
      - WORKERS=${WORKERS:-8}
      - BATCH_SIZE=${BATCH_SIZE:-2}
    ports:
      - "8000:8000"
