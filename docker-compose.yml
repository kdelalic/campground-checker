services:
  campsite-checker:
    build: .
    restart: unless-stopped
    volumes:
      - ./campsites.yaml:/app/campsites.yaml
    environment:
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET_NAME
      - R2_CUSTOM_DOMAIN
    ports:
      - "8000:8000"
