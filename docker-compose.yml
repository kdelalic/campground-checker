services:
  campsite-checker:
    build: .
    restart: unless-stopped
    volumes:
      # Config is git-managed and the source of truth, so the container gets it
      # read-only. Change monitored campgrounds by editing this file and pushing.
      - ./campsites.yaml:/app/campsites.yaml:ro
      # Telegram dedup keys, persisted so a redeploy doesn't re-alert on
      # availability you have already been told about.
      - ./state:/app/state
    environment:
      - SENT_KEYS_PATH=/app/state/sent_keys.json
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET_NAME
      - R2_CUSTOM_DOMAIN
      - THROTTLE_BASE_DELAY=${THROTTLE_BASE_DELAY:-30}
      - THROTTLE_MAX_DELAY=${THROTTLE_MAX_DELAY:-900}
    ports:
      - "8000:8000"
