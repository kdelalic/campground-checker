# campsites.example.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Campsite availability checker config.
# Copy this file to campsites.yaml and fill in your campground IDs.
#
# Run: python check_campsites.py
#
# Campsites are grouped by provider under the 'campsites' key.
# Campground names are fetched automatically from the booking service.
#
# Providers: RecreationDotGov | Yellowstone | GoingToCamp | ReserveCalifornia
#
# Required (at least one of):
#   campground_id   - The booking-service campground/facility ID
#   recreation_area - The recreation area ID (searches all campgrounds within)
#
# Optional:
#   campsite_id     - Specific site ID (int or list) to narrow the search
#   nights          - Minimum consecutive nights required. Default: 1
#   weekends_only   - true/false. Default: false
#   alert           - true/false. Default: false
#                     Set to true to enable Telegram alerts for this campground.
#                     All campgrounds still appear on the dashboard and terminal.
#
# Date range is set via CLI flags, not here:
#   --start / --end       Override the search window
#   --day Friday Saturday Show specific weekdays (default: Saturday only)
#   --all-days            Show all days of the week
#
# Defaults (optional):
#   Set a top-level 'defaults' section to apply days/nights to all entries
#   that don't override them per-entry.  CLI flags still take priority.
#
# defaults:
#   days: [Friday, Saturday]
#   nights: 2
#
# Telegram notifications (optional):
#   telegram.bot_token  - Telegram bot token from @BotFather
#   telegram.chat_id    - Your Telegram chat/user ID
#   Credentials can also be provided via CLI flags or environment variables
#   (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID). Priority: CLI > env > config file.
# ─────────────────────────────────────────────────────────────────────────────

# telegram:
#   bot_token: "123456789:ABCdefGHI..."
#   chat_id: "987654321"

# Dashboard (optional):
#   Generates a static HTML dashboard after each scan.
#   Use --dashboard on the CLI, or configure here:
#
# dashboard:
#   output_path: "dashboard.html"
#   interval: 60                         # Minutes between dashboard-only scans (default: 60)
#   r2:                                  # Upload to Cloudflare R2 (optional)
#     account_id: "your_cf_account_id"
#     access_key_id: "your_r2_key"
#     secret_access_key: "your_r2_secret"
#     bucket_name: "my-bucket"
#     object_key: "index.html"
#     custom_domain: "https://campsites.example.com"

campsites:

  # ── Recreation.gov ──────────────────────────────────────────────────────────
  # Find campground IDs at recreation.gov: visit the campground page,
  # the URL contains facilityId=XXXXX. Or run:
  #   camply campgrounds --provider RecreationDotGov --search "campground name"

  RecreationDotGov:
    - campground_id: 232447
      nights: 2
      weekends_only: false

    - campground_id: 251869
      nights: 1
      weekends_only: false

    - recreation_area: 2902          # Searches all campgrounds within this rec area
      nights: 1
      weekends_only: false

    - recreation_area:
        - 2907                       # Rocky Mountain NP
        - 1074                       # A second area
      nights: 2

    - campground_id: 234429
      campsite_id: 7834              # Pin to one specific site
      alert: true                    # Enable Telegram alerts for this campground
      nights: 1

  # ── Yellowstone ─────────────────────────────────────────────────────────────
  # Find IDs with: camply campgrounds --provider Yellowstone

  Yellowstone:
    - campground_id: 72
      nights: 2

  # ── California State Parks ──────────────────────────────────────────────────
  # Find IDs with: camply campgrounds --provider ReserveCalifornia --search "park name"

  ReserveCalifornia:
    - campground_id: 608
      nights: 1

  # ── GoingToCamp (Canadian Provincial Parks) ─────────────────────────────────
  # Find rec area IDs with: camply recreation-areas --provider GoingToCamp --search "park name"

  GoingToCamp:
    - recreation_area: 1
      campground_id: 1
      nights: 2
