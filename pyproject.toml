[project]
name = "campsite-checker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "camply==0.34.2",
    "PyYAML==6.0.3",
    "pyTelegramBotAPI==4.36.0",
    "ruamel.yaml>=0.18.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["campsite_checker"]

[tool.ruff.lint.per-file-ignores]
"campsite_checker/dashboard.py" = ["E501", "W293"]
"check_campsites.py" = ["E501"]
"campsite_checker/config.py" = ["E501"]
"campsite_checker/notify.py" = ["E501"]
"campsite_checker/search.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
